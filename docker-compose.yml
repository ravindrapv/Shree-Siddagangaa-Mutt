version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: siddaganga_mutt_postgres
    restart: always
    environment:
      POSTGRES_DB: guest_stay_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: siddaganga_mutt_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@temple.org
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  pgdata:
